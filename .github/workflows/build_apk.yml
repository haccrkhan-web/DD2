                  itemCount: games.length,
                  itemBuilder: (context, index) {
                    final game = games[index];
                    return Container(
                      decoration: BoxDecoration(
                        color: Color(int.parse(game['color']!)),
                        borderRadius: BorderRadius.circular(10),
